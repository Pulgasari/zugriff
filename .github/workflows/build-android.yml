name: Build Android packages

# Packages the PWAs whose registry entry sets build.android == 'bubblewrap' in
# .shared/js/data/apps.js into Android apps (APK + AAB), one matrix job per app.
# Each app is wrapped as a Trusted Web Activity pointing at its live deployment
# with Bubblewrap — Google's official TWA tool, the same engine PWABuilder uses
# under the hood.
#
# (The old plan used a `pwa-builder/pwabuilder-action` — that action does not
#  exist, so this drives Bubblewrap directly instead.)
#
# ── SIGNING ──────────────────────────────────────────────────────────────────
# With the repo secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS set, the artifacts are signed with that
# stable key — the same app identity every run, Play-uploadable and usable for
# Digital Asset Links. Without the secrets the build falls back to a THROWAWAY
# per-run keystore: good only for "does it build / install to test", not stable
# (the SHA-256 changes every run, so assetlinks can't be pinned to it).
#
# To go stable: create one keystore (or share one across apps), add the four
# secrets, then read the value the "Print signing SHA-256" step logs into the
# single /.well-known/assetlinks.json (repo root) under each dev.zugriff.<slug>
# package. Exact commands: .github/scripts/README.md.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:        # manual only — packaging never runs on a commit
    inputs:
      app:
        description: 'single app slug to build (empty = all bubblewrap apps)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1 — read the registry, emit the list of bubblewrap app slugs as JSON
  discover-apps:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.parse.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Extract bubblewrap apps
        id: parse
        env:
          APP_FILTER: ${{ inputs.app }}
        run: node .github/scripts/get-bubblewrap-apps.js

  # Job 2 — one parallel build per app slug
  build-android:
    needs: discover-apps
    if: ${{ needs.discover-apps.outputs.apps != '[]' && needs.discover-apps.outputs.apps != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover-apps.outputs.apps) }}
    env:
      SITE_BASE: https://zugriff.dev   # the app's live origin (baked into the TWA)
      KEYSTORE_PATH: ${{ github.workspace }}/android.keystore
      # stable key from secrets when present, else the throwaway defaults below.
      # bubblewrap reads the *_PASSWORD envs for non-interactive signing.
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'android' }}
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          npm install --no-save @bubblewrap/core   # for gen-twa-manifest.mjs

      - name: Point Bubblewrap at the preinstalled JDK + SDK
        # writing this config up front stops Bubblewrap's interactive first-run
        # from trying to download its own JDK/SDK (which would hang in CI)
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' \
            "$JAVA_HOME" "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Provide the signing key (stable secret, else throwaway)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "signing with the stable keystore from secrets"
            echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          else
            echo "no ANDROID_KEYSTORE_BASE64 secret — generating a throwaway TEST key"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
              -dname "CN=zugriff ${{ matrix.app }}, OU=test, O=pulgasari, C=DE"
          fi

      - name: Build ${{ matrix.app }}
        run: |
          DIR="build/${{ matrix.app }}"
          mkdir -p "$DIR"
          APP_SLUG="${{ matrix.app }}" node .github/scripts/gen-twa-manifest.mjs "$DIR/twa-manifest.json"
          cd "$DIR"
          bubblewrap update --skipVersionUpgrade    # scaffold the Android project from twa-manifest.json

          # Pre-build the release artifacts with Gradle directly, before handing
          # off to `bubblewrap build`. Bubblewrap (core 1.25.0) shells out to
          # gradle through child_process.exec/execFile WITHOUT a maxBuffer, so on a
          # cold build gradle's stdout+stderr blows past Node's 1 MB default and the
          # CLI dies with "stderr maxBuffer length exceeded" before it can sign —
          # and that error hides whatever gradle actually said. Running the release
          # tasks here sends gradle's output straight to the (unbounded) CI log, so
          # a real failure is visible, every download + cache is warmed, and
          # bubblewrap's own gradle run below comes back UP-TO-DATE — a few lines,
          # safely under the cap — leaving it only the signing to do.
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace --console=plain --no-daemon

          bubblewrap build --skipPwaValidation      # -> app-release-signed.apk + app-release-bundle.aab

      - name: Print signing SHA-256 (for assetlinks.json)
        run: |
          keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep -A1 'SHA256:' || true

      - name: Upload APK + AAB for ${{ matrix.app }}
        uses: actions/upload-artifact@v5
        with:
          name: android-${{ matrix.app }}
          path: |
            build/${{ matrix.app }}/*.apk
            build/${{ matrix.app }}/*.aab
          if-no-files-found: error
          retention-days: 14

  # Job 3 — gather every app's packages into one downloadable artifact
  collect:
    needs: build-android
    if: ${{ !cancelled() && needs.build-android.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download every app's packages
        uses: actions/download-artifact@v7
        with:
          path: android
          pattern: android-*
      - name: Bundle them into one artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-all               # one download, an android-<slug>/ folder per app
          path: android
          if-no-files-found: warn
          retention-days: 30
