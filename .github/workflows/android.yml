name: build android apps

# by hand only: actions -> build android apps -> run workflow. what it builds and how the apks are named
# is in .github/config.js (android), the work in .github/scripts/android.mjs. the apks land in a
# release (apk-<date>) as plain files: download, install. debug builds, signed with the throwaway key
# of the run. yaml keeps what github only reads here: the trigger and the setup actions.

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'the apps, space separated (empty: as .github/config.js says)'
        required: false
        default: ''

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release
    steps:
      - uses: actions/checkout@v4
        with: { path: zugriff }

      - id: config
        run: node zugriff/.github/scripts/config.mjs >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with: { node-version: '${{ steps.config.outputs.node }}' }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '${{ steps.config.outputs.java }}' }

      - uses: android-actions/setup-android@v3
        with: { packages: '${{ steps.config.outputs.sdk }}' }

      - run: node zugriff/.github/scripts/repos.mjs

      - name: rat's own dependencies (vite, acorn, unplugin)
        working-directory: rat
        run: npm ci

      - working-directory: zugriff
        env:
          APPS     : ${{ inputs.apps }}
          GH_TOKEN : ${{ github.token }}
        run: |
          node .github/scripts/android.mjs
