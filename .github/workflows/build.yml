name: build apps

# builds every app of apps/ with a build in its config.rat.js into www/ (rat build, @rat/dev), as
# zugriff.dev serves them. one that fails does not stop the others, the run fails at the end and
# names it.
#
# rat and the repos its import map points into are checked out side by side (.github/config.js:
# repos). a change there builds nothing by itself: run this by hand (actions -> build apps).
#
# debounced: a push waits (.github/config.js: debounce), a newer one cancels it. the commit made
# here uses GITHUB_TOKEN, which starts no new run.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/build.yml'
      - '.github/config.js'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: zugriff
          ref: ${{ github.ref }}

      - id: config
        run: node zugriff/.github/scripts/config.mjs >> "$GITHUB_OUTPUT"

      - name: wait for the last change
        if: github.event_name == 'push'
        run: sleep ${{ steps.config.outputs.debounce }}

      - run: node zugriff/.github/scripts/repos.mjs

      - uses: actions/setup-node@v4
        with: { node-version: '${{ steps.config.outputs.node }}' }

      - name: rat's own dependencies (vite, acorn, unplugin)
        working-directory: rat
        run: npm ci

      - name: build
        working-directory: zugriff
        run: |
          failed=''
          for app in apps/*/; do
            grep -q '^  build' "$app/config.rat.js" 2>/dev/null || continue
            node ../rat/packages/cli/index.js build "$app" || failed="$failed $(basename "$app")"
          done
          echo "failed=$failed" >> "$GITHUB_ENV"

      - name: commit
        working-directory: zugriff
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A www
          git diff --cached --quiet || {
            git commit -m 'www: rebuild'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }
          if [ -n "$failed" ]; then echo "::error::did not build:$failed"; exit 1; fi
