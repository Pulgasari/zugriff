name: Build Capacitor packages

# Packages the PWAs whose registry entry sets build.android == 'capacitor' in
# .shared/js/data/apps.js into Android apps (APK + AAB), one matrix job per app —
# the Capacitor counterpart to build-android.yml (which does the same with
# Bubblewrap/TWA). An app targets exactly one android builder.
#
# Why both exist: a TWA is just Chrome, so an app wrapped that way is stuck with
# the browser File System Access API — and on Android that API re-confirms every
# granted folder on each visit, which breaks the "grant a folder once and browse
# it" model the folder apps rely on. A Capacitor wrapper instead injects a native
# filesystem bridge (@capacitor/filesystem) whose Storage Access Framework grant
# is *persisted*, so re-granting is silent. The shared filesystem layer
# (.shared/js/filesystem/) detects the Capacitor runtime and routes through that
# native fs automatically (see platform.js + cap-fs.js).
#
# Like the TWA build, each app is wrapped around its LIVE deployment URL
# (server.url = https://zugriff.dev/<slug>/) rather than bundling its files —
# Capacitor still injects its bridge into that remote page, so the plugins work.
#
# ── SIGNING ──────────────────────────────────────────────────────────────────
# With the repo secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS set, the artifacts are signed with that
# stable key — the same app identity every run, Play-uploadable and usable for
# Digital Asset Links. Without the secrets the build falls back to a THROWAWAY
# per-run keystore: good only for "does it build / install to test", not stable.
#
# To go stable: create one keystore (or share one across apps), add the four
# secrets, then read the value the "Print signing SHA-256" step logs into the
# single /.well-known/assetlinks.json (repo root) under each dev.zugriff.<slug>
# package. appIds follow dev.zugriff.<slug>, the same as the TWA package ids, so
# the file is shared. Exact commands: .github/scripts/README.md.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:        # manual only — packaging never runs on a commit
    inputs:
      app:
        description: 'single app slug to build (empty = all capacitor apps)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-capacitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1 — read the registry, emit the list of capacitor app slugs as JSON
  discover-apps:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.parse.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Extract capacitor apps
        id: parse
        env:
          APP_FILTER: ${{ inputs.app }}
        run: node .github/scripts/get-capacitor-apps.js

  # Job 2 — one parallel build per app slug
  build-capacitor:
    needs: discover-apps
    if: ${{ needs.discover-apps.outputs.apps != '[]' && needs.discover-apps.outputs.apps != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover-apps.outputs.apps) }}
    env:
      SITE_BASE: https://zugriff.dev   # the app's live origin (baked into server.url)
      BUILD_TOOLS: '34.0.0'
      KEYSTORE_PATH: ${{ github.workspace }}/android.keystore
      # stable key from secrets when present, else the throwaway defaults below.
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'android' }}
      STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;${BUILD_TOOLS}" > /dev/null
          # put zipalign + apksigner (used to sign the release artifacts) on PATH
          echo "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"

      - name: Provide the signing key (stable secret, else throwaway)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "signing with the stable keystore from secrets"
            echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          else
            echo "no ANDROID_KEYSTORE_BASE64 secret — generating a throwaway TEST key"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=zugriff ${{ matrix.app }}, OU=test, O=pulgasari, C=DE"
          fi

      - name: Scaffold the Capacitor project for ${{ matrix.app }}
        run: |
          DIR="build/${{ matrix.app }}"
          mkdir -p "$DIR"
          # capacitor.config.json (server.url -> live app) + www/ offline fallback
          APP_SLUG="${{ matrix.app }}" node .github/scripts/gen-capacitor-config.mjs "$DIR"

          cd "$DIR"
          npm init -y > /dev/null
          # Capacitor 6 line + the native filesystem plugin and the SAF directory
          # picker the shim (cap-fs.js) talks to
          npm install --no-audit --no-fund \
            @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
            @capacitor/filesystem@6 @capawesome/capacitor-file-picker@6

          npx cap add android
          npx cap sync android

      - name: Build ${{ matrix.app }} (Gradle)
        run: |
          cd "build/${{ matrix.app }}/android"
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace --console=plain --no-daemon

      - name: Sign the APK + AAB
        run: |
          cd "build/${{ matrix.app }}/android"
          OUT="app/build/outputs"
          APK_IN="$OUT/apk/release/app-release-unsigned.apk"
          AAB_IN="$OUT/bundle/release/app-release.aab"
          SLUG="${{ matrix.app }}"

          # APK: zipalign then apksigner
          zipalign -f 4 "$APK_IN" "aligned.apk"
          apksigner sign \
            --ks "$KEYSTORE_PATH" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
            --out "${SLUG}-release.apk" "aligned.apk"

          # AAB: jarsigner (bundles are signed with the same key)
          jarsigner -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -signedjar "${SLUG}-release.aab" "$AAB_IN" "$KEY_ALIAS"

      - name: Print signing SHA-256 (for assetlinks.json)
        run: |
          keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" | grep -A1 'SHA256:' || true

      - name: Upload APK + AAB for ${{ matrix.app }}
        uses: actions/upload-artifact@v5
        with:
          name: capacitor-${{ matrix.app }}
          path: |
            build/${{ matrix.app }}/android/${{ matrix.app }}-release.apk
            build/${{ matrix.app }}/android/${{ matrix.app }}-release.aab
          if-no-files-found: error
          retention-days: 14

  # Job 3 — gather every app's packages into one downloadable artifact
  collect:
    needs: build-capacitor
    if: ${{ !cancelled() && needs.build-capacitor.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download every app's packages
        uses: actions/download-artifact@v7
        with:
          path: capacitor
          pattern: capacitor-*
      - name: Bundle them into one artifact
        uses: actions/upload-artifact@v5
        with:
          name: capacitor-all             # one download, a capacitor-<slug>/ folder per app
          path: capacitor
          if-no-files-found: warn
          retention-days: 30
