<!DOCTYPE html>
<html lang="en" data-theme="dracula">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="manifest" href="./manifest.json">

  <!-- app colour -->
  <meta name="theme-color" content="#1e1b2e">
  <meta name="msapplication-TileColor" content="#1e1b2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="#1e1b2e">

  <!-- icon -->
  <link rel="icon" href="./app.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./app.svg">

  <!-- title (also set from the registry at boot) -->
  <title>Looksmaxx</title>
  <meta name="apple-mobile-web-app-title" content="Looksmaxx">

  <!-- apps link only the apps base (reset + theme tokens + #app frame) + own sheet -->
  <link rel="stylesheet" href="/.shared/css/base.css">
  <link rel="stylesheet" href="./app.css">

  <script src="/.shared/js/boot.js"></script>
</head>
<body>
  <div id="app">
    <div id="app-loading">…</div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
