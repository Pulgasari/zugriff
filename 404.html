<!DOCTYPE html>
<html lang="en">

<!--
the start page of zugriff.dev and the page for whatever is not found, one file.
vercel serves it for every 404, middleware.js rewrites zugriff.dev/ to it. a
subdomain without a bundle gets it as well, and there every path is rewritten into
www/<subdomain>/: so the page needs nothing from outside, logo and css are inline.
the start page then adds the shell's look (boot.js, aufbau), a 404 page stays plain
-->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b">
  <title>zugriff</title>

  <script>
    // the start page is zugriff.dev/ (or www.), anything else that ends up here was not found
    const host  = location.hostname;
    const apex  = !host.endsWith('.zugriff.dev') || host === 'www.zugriff.dev';
    const start = apex && location.pathname === '/';
    document.documentElement.dataset.page = start ? 'start' : 'missing';
    if (!start) document.title = '404 | not found · zugriff';
  </script>

  <script src="/.shared/js/boot.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }

    body {
      background  : #0b0b0b;
      color       : #c8d0e0;
      display     : grid;
      font-family : system-ui, sans-serif;
      place-items : center;
    }

    #app {
      align-items    : center;
      display        : flex;
      flex-direction : column;
      gap            : 2rem;
      padding        : 1rem;
    }
    
    #missing { display: none; opacity: 0.5; text-align: center; }
    nav { display: flex; flex-flow: row wrap; align-items: center; justify-content: center; }
  </style>
</head>

<body>

  <div id="app">
    <nav>
      <a href="/cli/">CLI</a>
      <a href="/code/">Code</a>
      <a href="/ebooks/">eBooks</a>
      <a href="/feeds/">Feeds</a>
      <a href="https://files.zugriff.dev">Files</a>
      <a href="/icons/">Icons</a>
      <a href="/images/">Images</a>
      <a href="/notes/">Notes</a>
      <a href="/podcasts/">Podcasts</a>
      <a href="/prompts/">Prompts</a>
      <a href="/todo/">Todo</a>
      <a href="/tools/">Tools</a>
      <a href="/videos/">Videos</a>
    </nav>

    <div>
      <svg-file src='/logo1.svg'></svg-file>
      <div id="missing">404 | not found.</div>
    </div>

    <nav>
      <a href="/cli/">CLI</a>
      <a href="/code/">Code</a>
      <a href="/ebooks/">eBooks</a>
      <a href="/feeds/">Feeds</a>
      <a href="https://files.zugriff.dev">Files</a>
      <a href="/icons/">Icons</a>
      <a href="/images/">Images</a>
      <a href="/notes/">Notes</a>
      <a href="/podcasts/">Podcasts</a>
      <a href="/prompts/">Prompts</a>
      <a href="/todo/">Todo</a>
      <a href="/tools/">Tools</a>
      <a href="/videos/">Videos</a>
    </nav>
  </div>

  <script type="module">
    const [
      { default: aufbau },
      { default: getStyleToken },
    ] = await Promise.all([
      import('@aufbau/api'),
      import('@domina/methods/getStyleToken.js'),
    ]);

    await aufbau.boot({ css: { layout: 'landing', palette: 'synthwave' } });

    const bg = getStyleToken('color-bg') || '#000000';
    const fg = getStyleToken('color-fg') || '#c8d0e0';
    aufbau.filters.apply('body', 'glitch-live', { animate: true, speed: '2s' });
    aufbau.patterns.apply('body', 'grid', { bg, fg: fg + '22', motion: 'up', speed: '1s', size: 44, width: 1 });      
  </script>

</body>
</html>
