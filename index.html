<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#282a36">
  <meta name="msapplication-TileColor" content="#282a36">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="#282a36">
  
  <title>zugriff</title>
  <link rel="stylesheet" href="/.shared/css/index.css">

  <script>
    (() => {
      // the app: named by the page itself (a bundle, <html data-app>), else by the path.
      // without one this is no app page, the module below sends it to /404.html
      const route = document.documentElement.dataset.app || location.pathname.split('/')[1];
      if (!route) return;

      const base = '/' + route;
      const link = (rel, href, props) => document.head.append(Object.assign(document.createElement('link'), { rel, href, ...props }));

      document.documentElement.dataset.app = route;
      link('manifest',         base + '/manifest.json');
      link('icon',             base + '/app.svg', { type: 'image/svg+xml' });
      link('apple-touch-icon', base + '/app.svg');
      link('stylesheet',       base + '/app.css');
    })();
  </script>

  <script src="/.shared/js/boot.js"></script>

  <style>
    :root.is-loading #app { opacity: 0; filter: blur(3px); }
    :root.is-ready   #app { opacity: 1; filter: none; transition: opacity 500ms ease, filter 500ms ease; }
  </style>
</head>

<body class="mobilefix">

<app-root id='app' routing='hash'></app-root>

<script type="module">
  try { await (window.__ZUGRIFF_READY__ ?? import('/.shared/js/runtime.js')); }
  catch (error) { console.error('[shell] runtime not ready:', error); }

  // an address that names no app (zugriff.dev/apps/, a typo) is not found
  const route = document.documentElement.dataset.app;

  if (!route || !globalThis.zugriff?.registry?.has(route)) location.replace('/404.html');
  else await import('/' + route + '/app.js');
  
  if (route === 'icons') await import('https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js').catch(() => {});
</script>
<script type="module">
  const dev = new URLSearchParams(location.search).get('dev');

  if (dev !== null && dev !== 'off' && dev !== '0') {
    try           { await import('@aufbau/devtools/boot.js'); }
    catch (error) { console.error('[shell] devtools not loaded:', error); }
  }
</script>

</body>
</html>
