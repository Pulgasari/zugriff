	function getRandomEntry (map) {
      const keys = Object.keys(map);
      const key  = keys[Math.floor(Math.random() * keys.length)];
      return { key, value: map[key] };
    }

	function getRandomItem (arr) {
  	  if (!arr || arr.length === 0) return undefined;
  	  return arr[Math.floor(Math.random() * arr.length)];
	}
    
    const filtersMap = {
      'glitch-heavy-cyber' : { animate: true, frequency: "0.0 0.95", scale: 40, speed: "1.5s" },
      'glitch-live'        : { animate: true, speed: "2s" },
      'night-vision'       : { animate: true, noise: 0.5, speed: "0.4s" },
    };

    const { key, value } = getRandomEntry(filtersMap);
    applyFilter('body', key, value);
