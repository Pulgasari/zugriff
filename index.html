<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#282a36">
  <meta name="msapplication-TileColor" content="#282a36">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="#282a36">
  
  <title>zugriff</title>
  <link rel="stylesheet" href="/.shared/css/index.css">

  <script>
    (() => {
      const route    = location.pathname.split('/')[1] || 'home';
      const launcher = route === 'home' || route === 'apps' || route === 'tools';
      const head     = document.head;
      const link     = (rel, href, props) => head.append(Object.assign(document.createElement('link'), { rel, href, ...props }));

      if (launcher) {
        link('icon', '/icon.svg', { type: 'image/svg+xml' });
        link('stylesheet', '/.shared/css/launcher.css');
      } else {
        const base = '/' + route;
        document.documentElement.dataset.app   = route;
        document.documentElement.dataset.theme = 'dracula';
        link('manifest', base + '/manifest.json');
        link('icon', base + '/app.svg', { type: 'image/svg+xml' });
        link('apple-touch-icon', base + '/app.svg');
        link('stylesheet', '/.shared/css/explorer.css');
        link('stylesheet', '/.shared/css/apps.css');
        link('stylesheet', '/.shared/css/devtools.css');
        link('stylesheet', base + '/app.css');
      }
    })();
  </script>

  <script src="/.shared/js/boot.js"></script>

  <style>
    :root.is-loading #app { opacity: 0; filter: blur(3px); }
    :root.is-ready   #app { opacity: 1; filter: none; transition: opacity 500ms ease, filter 500ms ease; }
    /* launcher-only backdrop layers */
    .bg-grid { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.12; }
    body > #app, #welcome, header, footer { position: relative; z-index: 1; }
  </style>
</head>

<body class="mobilefix">

<div id='app'></div>

<script type="module">
  // the single mount point: await the runtime boot.js started, then hand off to the
  // launcher module (home/apps/tools) or the route's own app.js (an app route).
  try { await (window.__ZUGRIFF_READY__ ?? import('/.shared/js/runtime.js')); }
  catch (error) { console.error('[shell] runtime not ready:', error); }

  const route    = location.pathname.split('/')[1] || 'home';
  const launcher = route === 'home' || route === 'apps' || route === 'tools';

  if (launcher) {
    await import('/.shared/js/launcher.js');
  } else {
    if (route === 'icons') await import('https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js').catch(() => {});
    await import('/' + route + '/app.js');
  }
</script>
<script type="module">
  // devtools are opt-in: any ?dev in the query pulls them in, ?dev=off / ?dev=0 keeps them out.
  // the specifier comes from the importmap boot.js injects.
  const dev = new URLSearchParams(location.search).get('dev');

  if (dev !== null && dev !== 'off' && dev !== '0') {
    try { await import('@pulgasari/devtools/boot.js'); }
    catch (error) { console.error('[shell] devtools not loaded:', error); }
  }
</script>

</body>
</html>
